name: Gemini Diagnostics
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test response schemas or assess, summarize and audit one fresh BBC article'
        type: choice
        options: [schemas, end-to-end]
        default: schemas
      model:
        description: 'Use configured model or test the Flash-Lite alternative'
        type: choice
        options: [configured, gemini-3.5-flash-lite]
        default: configured
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Test Gemini without sending email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model != 'configured' && inputs.model || vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ inputs.model == 'configured' && (vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite') || '' }}
          DIAGNOSTIC_MODE: ${{ inputs.mode || 'schemas' }}
        run: python scripts/diagnose_gemini.py --mode "$DIAGNOSTIC_MODE"
      - name: Save diagnostic preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
