name: Daily Morning Briefing

on:
  schedule:
    # Preserve the current schedule: 00:45 UTC = 07:45 WIB (delivery may be delayed).
    - cron: '45 0 * * *'
  workflow_dispatch:
    inputs:
      retry_uncertain:
        description: 'Retry an uncertain delivery only after checking your mailbox'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-briefing-delivery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches packages for faster runs
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify offline news and email behavior
        run: python -m pytest -q

      - name: Prepare checkpoint SDK
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install checkpoint SDK
        run: npm ci --prefix scripts/checkpoint --ignore-scripts

      - name: Verify checkpoint behavior
        run: node scripts/checkpoint/test.cjs

      - name: Find trusted edition checkpoint
        id: restore
        uses: actions/github-script@v7
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Jakarta' }}
        with:
          script: |
            await require('./scripts/restore_state.cjs').restore({github, context, core});

      - name: Restore durable delivery state
        if: steps.restore.outputs.artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.restore.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.restore.outputs.run_id }}
          path: .state
          merge-multiple: true
          
      - name: Generate and Send Briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Jakarta' }}
          REQUIRE_REMOTE_CHECKPOINT: 'true'
          RETRY_UNCERTAIN: ${{ inputs.retry_uncertain || 'false' }}
        run: |
          if [ "$RETRY_UNCERTAIN" = "true" ]; then
            python briefing.py --retry-uncertain
          else
            python briefing.py
          fi

      - name: Save preview and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
